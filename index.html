<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>humaneed - Flow Vertical</title>
<style>
  * {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body {font-family:-apple-system, BlinkMacSystemFont,'Segoe UI',sans-serif; background:#000; color:#fff; line-height:1.5;}
  .flow-container {max-width:500px;margin:0 auto;padding:16px;}
  .block {margin-bottom:32px;padding:24px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;transition:transform 0.2s; cursor:default;}
  .block h2 {margin-bottom:16px;font-size:18px;color:#fff;}
  .card {background:#1a1a1a;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;}
  .card:active {transform:scale(0.98);}
  .card h3{margin-bottom:8px;font-size:16px;}
  .card p{font-size:14px;color:#ccc;}
  .slider, input[type="number"]{width:100%;margin-top:8px;padding:8px;border-radius:6px;border:1px solid #333;background:#000;color:#fff;}
  .dots {display:flex;gap:4px;margin-top:8px;}
  .dot {width:12px;height:12px;background:#1a1a1a;border-radius:50%;cursor:pointer;}
  .dot.active {background:#fff;}
</style>
</head>
<body>
<div class="flow-container" id="flow">

  <!-- ZUSTAND + IMPULSE -->
  <div class="block" id="stateBlock">
    <h2>Dein Zustand</h2>
    <div id="stateDisplay"></div>
    <h3>Hilfreiche Impulse</h3>
    <div id="impulseList"></div>
  </div>

  <!-- MASLOW / BEDÜRFNISSE -->
  <div class="block" id="needsBlock">
    <h2>Grundbedürfnisse</h2>
    <div>
      <label>Wasser: <span id="waterValue"></span>/8</label>
      <div class="dots" id="waterDots"></div>
    </div>
    <div>
      <label>Schlaf: <span id="sleepValue"></span>h</label>
      <input type="range" min="0" max="12" step="0.5" id="sleepSlider">
    </div>
    <div>
      <label>Aktivität: <span id="activityValue"></span> Min</label>
      <input type="number" id="activityInput" placeholder="Minuten">
    </div>
  </div>

  <!-- FINANZEN / BUDGET -->
  <div class="block" id="budgetBlock">
    <h2>Budget</h2>
    <div>Verfügbar: <span id="budgetValue"></span>€</div>
    <div>Ausgegeben: <span id="spentValue"></span>€</div>
    <input type="number" id="spendInput" placeholder="Ausgabe hinzufügen">
    <button onclick="addSpend()">Hinzufügen</button>
  </div>

  <!-- BOOSTER / INTERVENTIONEN -->
  <div class="block" id="boosterBlock">
    <h2>Booster / Interventionen</h2>
    <div id="boosterList"></div>
  </div>

  <!-- SYSTEM / HISTORIE -->
  <div class="block" id="systemBlock">
    <h2>Systemübersicht</h2>
    <div>Energie: <span id="energyValue"></span>%</div>
    <div>Zustand: <span id="currentState"></span></div>
    <div>Aktionen heute: <span id="actionsCount"></span></div>
  </div>

</div>

<script>
  // STATES
  const STATES = {
    exhausted:{name:'Erschöpft',emoji:'😴',desc:'Körper und Geist brauchen Pause'},
    restless:{name:'Unruhig',emoji:'😰',desc:'Innere Spannung'},
    overwhelmed:{name:'Überladen',emoji:'🤯',desc:'Zu viele offene Aufgaben'},
    empty:{name:'Leer',emoji:'😶',desc:'Antriebslos, keine Richtung'},
    clear:{name:'Klar',emoji:'✨',desc:'Fokussiert und handlungsfähig'},
    blocked:{name:'Blockiert',emoji:'🧱',desc:'Festgefahren, komme nicht weiter'},
    stable:{name:'Stabil',emoji:'🟢',desc:'Grundbedürfnisse erfüllt'},
    tense:{name:'Angespannt',emoji:'😬',desc:'Körperlich verkrampft'}
  };

  // IMPULSES
  const IMPULSES = [
    {name:'4-7-8 Atmung',desc:'Atmen: 4/7/8 Sekunden.',states:['restless','tense','overwhelmed'],effect:{energy:+10}},
    {name:'Wasser trinken',desc:'Volles Glas Wasser.',states:['exhausted','empty','blocked'],effect:{water:+1,energy:+5}},
    {name:'Bewegungs-Burst',desc:'Kurze Bewegung.',states:['empty','blocked','tense'],effect:{activity:+2,energy:+15}},
    {name:'Augen zu',desc:'30 Sekunden Pause.',states:['overwhelmed','restless','exhausted'],effect:{energy:+5}},
    {name:'Power Pose',desc:'2 Min Pose halten.',states:['empty','blocked'],effect:{energy:+10}}
  ];

  const system = {water:0,sleep:7,activity:0,budget:30,spent:0,energy:50,currentState:'empty',history:[]};

  function calculateState(){
    if(system.energy<20) return 'exhausted';
    if(system.activity===0) return 'empty';
    if(system.sleep<6) return 'restless';
    return 'clear';
  }

  function renderFlow(){
    system.currentState = calculateState();
    const state = STATES[system.currentState];
    document.getElementById('stateDisplay').innerHTML = `<div>${state.emoji} ${state.name}<br><small>${state.desc}</small></div>`;
    // Impulses
    const impulseHTML = IMPULSES.filter(i=>i.states.includes(system.currentState))
      .map(i=>`<div class="card" onclick="doImpulse('${i.name}')"><h3>${i.name}</h3><p>${i.desc}</p></div>`).join('');
    document.getElementById('impulseList').innerHTML = impulseHTML;
    // Maslow
    document.getElementById('waterValue').innerText = system.water;
    document.getElementById('sleepValue').innerText = system.sleep;
    document.getElementById('activityValue').innerText = system.activity;
    document.getElementById('budgetValue').innerText = (system.budget-system.spent).toFixed(2);
    document.getElementById('spentValue').innerText = system.spent.toFixed(2);
    document.getElementById('energyValue').innerText = system.energy;
    document.getElementById('currentState').innerText = state.name;
    document.getElementById('actionsCount').innerText = system.history.filter(h=>h.type==='impulse').length;
    renderWaterDots();
  }

  function renderWaterDots(){
    const container = document.getElementById('waterDots');
    container.innerHTML='';
    for(let i=0;i<8;i++){
      const dot=document.createElement('div');
      dot.className='dot'+(i<system.water?' active':'');
      dot.onclick=()=>{system.water=i+1;renderFlow();}
      container.appendChild(dot);
    }
  }

  document.getElementById('sleepSlider').addEventListener('input',e=>{system.sleep=parseFloat(e.target.value);renderFlow();});
  document.getElementById('activityInput').addEventListener('input',e=>{system.activity=parseInt(e.target.value)||0;renderFlow();});

  function addSpend(){
    const val=parseFloat(document.getElementById('spendInput').value)||0;
    system.spent+=val;
    renderFlow();
  }

  function doImpulse(name){
    const imp=IMPULSES.find(i=>i.name===name);
    if(imp.effect.water) system.water=Math.min(8,system.water+imp.effect.water);
    if(imp.effect.activity) system.activity+=imp.effect.activity;
    if(imp.effect.energy) system.energy=Math.min(100,system.energy+imp.effect.energy);
    system.history.push({type:'impulse',name:name,timestamp:Date.now()});
    renderFlow();
  }

  renderFlow();
</script>
</body>
</html>
