<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUMANEED">
<meta name="description" content="HUMANEED - Dein persönliches Biological Operating System für Balance, Fokus und Wachstum.">
<meta name="author" content="humaneed">
<title>humaneed | OS for Humans</title>
<style>
:root {
    --bg: #000;
    --card: #0d0d0d;
    --border: #1e1e1e;
    --accent: #00ff88;
    --warning: #ff4757;
    --text-dim: #888;
    --text-bright: #fff;
    --vitality: #ff4757;
    --resilience: #3742fa;
    --growth: #a55eea;
    --glow: rgba(0, 255, 136, 0.3);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { 
    height: 100%; overflow: hidden; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background: var(--bg); color: var(--text-bright); 
}

/* Base Screens */
#screens { position: relative; width: 100%; height: 100%; }
.screen { 
    position: absolute; width: 100%; height: 100%; 
    display: flex; flex-direction: column; align-items: center; 
    padding: 100px 24px 40px; opacity: 0; transform: translateY(20px);
    transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1); 
    pointer-events: none; overflow-y: auto;
}
.screen.active { opacity: 1; transform: translateY(0); pointer-events: all; z-index: 10; }

/* Header Elements */
.header-stats { 
    position: fixed; top: 0; width: 100%; padding: 25px 24px; 
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--border);
}
.brand { font-size: 13px; font-weight: 900; letter-spacing: 3px; color: var(--text-bright); }
.streak-box { background: rgba(255, 71, 87, 0.1); padding: 6px 14px; border-radius: 30px; border: 1px solid var(--vitality); font-size: 11px; font-weight: 800; color: var(--vitality); }

/* Dashboard Visuals */
.status-overview { display: flex; gap: 15px; margin-bottom: 30px; width: 100%; max-width: 360px; justify-content: center; }
.status-ring { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
.status-ring svg { transform: rotate(-90deg); width: 80px; height: 80px; }
.status-ring circle { fill: none; stroke-width: 6; stroke-linecap: round; }
.status-ring .bg { stroke: #1a1a1a; }
.status-ring .progress { stroke-dasharray: 226; stroke-dashoffset: 226; transition: stroke-dashoffset 1s ease; }
.status-ring .icon { position: absolute; font-size: 20px; }

/* Components */
.emoji-hero { font-size: 72px; margin-bottom: 24px; animation: float 4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

.title { font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 8px; letter-spacing: -0.5px; }
.subtitle { font-size: 16px; color: var(--text-dim); text-align: center; max-width: 300px; margin-bottom: 40px; line-height: 1.6; }

.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: 24px; width: 100%; max-width: 360px; margin-bottom: 16px;
    cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
    overflow: hidden;
}
.card:active { transform: scale(0.96); border-color: var(--accent); }
.card.highlight { background: linear-gradient(145deg, #111, #050505); border-color: #333; }
.card.accent-border { border-left: 4px solid var(--accent); }

.btn { 
    width: 100%; max-width: 360px; background: var(--text-bright); color: #000; border: none; 
    border-radius: 20px; padding: 22px; font-size: 16px; font-weight: 800; 
    cursor: pointer; margin-top: 12px; transition: 0.3s;
}
.btn-secondary { background: transparent; color: var(--text-bright); border: 1px solid var(--border); }

/* Inputs */
.input-group { width: 100%; max-width: 360px; margin-bottom: 24px; }
.input-label { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px; display: block; display: flex; justify-content: space-between; }
input[type="range"] { width: 100%; height: 8px; border-radius: 10px; background: #1a1a1a; appearance: none; outline: none; margin-bottom: 10px; }
input[type="range"]::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 4px solid #000; box-shadow: 0 0 10px var(--glow); }

/* Science Content Styling */
.science-box { background: #080808; border-radius: 24px; padding: 24px; margin-top: 20px; border: 1px solid #222; width: 100%; max-width: 360px; }
.sci-tag { color: var(--accent); font-size: 10px; font-weight: 900; text-transform: uppercase; margin-bottom: 12px; display: block; letter-spacing: 1px; }
.sci-detail { margin-bottom: 16px; }
.sci-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 4px; }
.sci-text { font-size: 14px; line-height: 1.5; color: #ddd; }

/* Diagnostic Animation */
.scan-line { width: 100%; height: 2px; background: var(--accent); box-shadow: 0 0 15px var(--accent); position: absolute; left: 0; top: -10%; animation: scan 3s linear infinite; }
@keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

/* Legal Banner */
#legalBanner {
    position: fixed; bottom: 20px; left: 20px; right: 20px; background: #0a0a0a; border: 1px solid var(--border);
    padding: 20px; border-radius: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8);
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="header-stats">
    <div class="brand">HUMANEED OS</div>
    <div class="streak-box" id="global-streak">🔥 0 STREAK</div>
</div>

<div id="screens"></div>

<div id="legalBanner">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 1px;">HAFTUNGSAUSSCHLUSS</div>
    <div style="font-size: 11px; color: var(--text-dim); line-height: 1.5;">
        Die Inhalte dienen ausschließlich der allgemeinen Information und Selbsterfahrung. Sie ersetzen keine professionelle medizinische oder psychologische Diagnose oder Behandlung.
    </div>
    <button class="btn" style="padding: 12px; font-size: 12px; margin-top: 10px;" onclick="dismissLegal()">Verstanden</button>
</div>

<script>
// --- CORE ENGINE DATABASE ---
const DATABASE = {
    vitality: {
        name: 'Vitalität', icon: '🔋', color: 'var(--vitality)',
        actions: {
            sun: { title: 'Photonen-Dusche', prompt: 'Geh 5-10 Min. nach draußen (direktes Tageslicht).', xp: 30, why: 'Lichtmangel / Zirkadiane Störung', mechanism: 'Morgenlicht triggert die Cortisol-Ausschüttung (Wachheit) und programmiert die Melatonin-Produktion für ca. 14h später vor.', benefit: 'Besserer Schlaf, höhere Wachheit am Tag.' },
            ground: { title: 'Earthing', prompt: 'Barfuß auf Gras, Erde oder Stein stehen.', xp: 20, why: 'Elektromagnetische Last / Entzündung', mechanism: 'Elektronen-Austausch mit der Erde reduziert freie Radikale und stabilisiert das vegetative Nervensystem.', benefit: 'Weniger Stress, schnellere Regeneration.' },
            magnesium: { title: 'Nervenschutz', prompt: 'Nimm Magnesium oder iss eine Handvoll Nüsse.', xp: 15, why: 'Nervöse Unruhe / Verspannung', mechanism: 'Magnesium blockiert NMDA-Rezeptoren und verhindert so eine Übererregung der Nervenzellen.', benefit: 'Entspannte Muskeln, beruhigtes Nervensystem.' }
        }
    },
    resilience: {
        name: 'Resilienz', icon: '🧠', color: 'var(--resilience)',
        actions: {
            dopamine: { title: 'Dopamin-Reset', prompt: 'Leg das Smartphone für 30 Min. in einen anderen Raum.', xp: 40, why: 'Reizüberflutung / Aufmerksamkeitsdefizit', mechanism: 'Reduziert die unnatürlich hohe Reizfrequenz im Belohnungssystem und lässt Dopamin-Rezeptoren regenerieren.', benefit: 'Höhere Konzentrationsfähigkeit, weniger Suchtdruck.' },
            cold: { title: 'Kälte-Impuls', prompt: 'Gesicht 30s in eiskaltes Wasser tauchen.', xp: 30, why: 'Akuter Stress / Panik-Gefühl', mechanism: 'Aktiviert den "Mammalian Dive Reflex" – senkt sofort die Herzfrequenz und dämpft die Amygdala.', benefit: 'Sofortige Ruhe, emotionaler Stopp.' },
            box: { title: 'Box-Breathing', prompt: '4s Ein, 4s Halten, 4s Aus, 4s Halten (4x).', xp: 25, why: 'Oberflächliche Atmung / Unruhe', mechanism: 'Synchronisiert Herzfrequenzvariabilität (HRV) und Blutgas-Verhältnis für kognitive Klarheit.', benefit: 'Präsenz, Fokus, Stressabbau.' }
        }
    },
    growth: {
        name: 'Evolution', icon: '✨', color: 'var(--growth)',
        actions: {
            uncomf: { title: 'Willenskraft', prompt: 'Tu etwas Kleines, das dich Überwindung kostet.', xp: 50, why: 'Komfortzonen-Stagnation', mechanism: 'Aktiviert den anterioren cingulären Cortex (aMCC) – das neuronale Zentrum für Zähigkeit.', benefit: 'Höhere Resilienz gegen zukünftige Belastungen.' },
            journal: { title: 'Neuro-Journaling', prompt: 'Notiere eine Sache, die du heute gelernt hast.', xp: 20, why: 'Zerstreutheit / Mangelnde Reflexion', mechanism: 'Fördert die Neuroplastizität durch bewusste Konsolidierung synaptischer Verbindungen im Hippocampus.', benefit: 'Besseres Gedächtnis, klares Selbstbild.' }
        }
    }
};

const SCAN_RULES = [
    { id: 'morning_check', cond: (s) => s.hour < 11 && s.energy < 40, res: { state: 'Cortisol-Lag', emoji: '🌅', desc: 'Dein System ist noch im Schlafmodus. Licht-Input dringend empfohlen.', action: 'sun' } },
    { id: 'burnout_risk', cond: (s) => s.energy < 20 && s.sleep < 6, res: { state: 'Energetisches Defizit', emoji: '🚨', desc: 'Kritische Erschöpfung detektiert. Fokus auf Parasympathikus.', action: 'cold' } },
    { id: 'brain_fog', cond: (s) => s.water < 3, res: { state: 'Brain Fog', emoji: '☁️', desc: 'Dehydration beeinträchtigt die neuronale Übertragung.', action: 'ground' } }
];

let system = JSON.parse(localStorage.getItem('hn_v3')) || {
    sleep: 7, water: 4, energy: 60,
    xp: { vitality: 0, resilience: 0, growth: 0 },
    streak: 0, hour: new Date().getHours()
};

function navigate(screenId, params = {}) {
    const container = document.getElementById('screens');
    const oldScreen = container.querySelector('.screen.active');
    const newScreen = document.createElement('div');
    newScreen.className = 'screen active';
    
    let html = '';
    switch(screenId) {
        case 'home':
            html = `
                <div class="emoji-hero">🧿</div>
                <div class="title">System-Status</div>
                <div class="subtitle">Deine biologische Performance-Übersicht</div>
                
                <div class="status-overview">
                    ${Object.entries(DATABASE).map(([key, data]) => {
                        const level = Math.floor(system.xp[key] / 100);
                        const progress = system.xp[key] % 100;
                        const offset = 226 - (226 * progress / 100);
                        return `
                        <div class="status-ring" onclick="navigate('actions', {cat:'${key}'})">
                            <svg><circle class="bg" cx="40" cy="40" r="36"/><circle class="progress" cx="40" cy="40" r="36" style="stroke:${data.color}; stroke-dashoffset:${offset}"/></svg>
                            <span class="icon">${data.icon}</span>
                        </div>`;
                    }).join('')}
                </div>

                <div class="card highlight accent-border" onclick="navigate('input')">
                    <div style="font-weight:900; font-size:18px;">Deep Scan</div>
                    <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">Analyse biometrischer Marker</div>
                </div>
                <div class="card" onclick="navigate('catalog')">
                    <div style="font-weight:900; font-size:18px;">Protokoll-Katalog</div>
                    <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">Interventionen wählen</div>
                </div>
                <div style="font-size:10px; color:var(--text-dim); margin-top:20px;">© humaneed | v3.1.0 Optimized</div>
            `;
            break;
            
        case 'input':
            html = `
                <div class="title">Status Quo</div>
                <div class="subtitle">Echtzeit-Abgleich deiner Parameter</div>
                <div class="input-group"><label class="input-label">Schlafqualität <span id="label-sleep">${system.sleep}h</span></label><input type="range" min="3" max="10" step="0.5" value="${system.sleep}" oninput="updateVal('sleep', this.value)"></div>
                <div class="input-group"><label class="input-label">Hydrierung (Gläser) <span id="label-water">${system.water}</span></label><input type="range" min="0" max="15" step="1" value="${system.water}" oninput="updateVal('water', this.value)"></div>
                <div class="input-group"><label class="input-label">Energielevel <span id="label-energy">${system.energy}%</span></label><input type="range" min="0" max="100" step="5" value="${system.energy}" oninput="updateVal('energy', this.value)"></div>
                <button class="btn" onclick="startScanAnimation()">Scan starten</button>
                <button class="btn btn-secondary" onclick="navigate('home')">Home</button>
            `;
            break;

        case 'scan':
            html = `
                <div class="scan-line"></div>
                <div class="emoji-hero">🔍</div>
                <div class="title">Diagnostic</div>
                <div class="subtitle" id="scan-status">Initialisiere Analyse...</div>
                <div style="width:100%; max-width:300px; font-family:monospace; font-size:12px; color:var(--accent); line-height:2;">
                    > Checking Neural Patterns...<br>
                    > Assessing Metabolic State...<br>
                    > Analyzing Circadian Alignment...
                </div>
            `;
            setTimeout(() => document.getElementById('scan-status').innerText = 'Berechne Empfehlung...', 1500);
            setTimeout(() => runScan(), 3000);
            break;

        case 'result':
            const r = params.res;
            html = `
                <div class="emoji-hero">${r.emoji}</div>
                <div class="title">${r.state}</div>
                <div class="subtitle">${r.desc}</div>
                <div class="science-box">
                    <span class="sci-tag">Optimierung</span>
                    <div class="sci-text">Empfohlenes Protokoll: <b>${DATABASE.vitality.actions[r.action]?.title || 'Gezielte Ruhe'}</b></div>
                </div>
                <button class="btn" onclick="navigate('catalog')">Intervenieren</button>
                <button class="btn btn-secondary" onclick="navigate('home')">Dashboard</button>
            `;
            break;

        case 'catalog':
            html = `
                <div class="title">Interventionen</div>
                <div style="width:100%; max-width:360px">
                    ${Object.entries(DATABASE).map(([id, cat]) => `
                        <div class="card highlight" onclick="navigate('actions', {cat:'${id}'})">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-size:24px;">${cat.icon}</span>
                                <div style="flex:1; margin-left:20px">
                                    <div style="font-weight:900; font-size:18px;">${cat.name}</div>
                                    <div style="font-size:10px; color:var(--text-dim); text-transform:uppercase;">Fortschritt: LVL ${Math.floor(system.xp[id]/100)}</div>
                                </div>
                                <div style="font-size:10px; font-weight:900; color:var(--accent)">XP ${system.xp[id]}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn btn-secondary" onclick="navigate('home')">Zurück</button>
            `;
            break;

        case 'actions':
            const c = DATABASE[params.cat];
            html = `
                <div class="title">${c.name}</div>
                <div class="subtitle">Wähle ein Protokoll für sofortigen Impact</div>
                <div style="width:100%; max-width:360px">
                    ${Object.entries(c.actions).map(([aId, a]) => `
                        <div class="card highlight accent-border" onclick="navigate('do', {cat:'${params.cat}', act:'${aId}'})">
                            <div style="font-weight:900; font-size:18px;">${a.title}</div>
                            <div style="font-size:11px; color:var(--accent); margin-top:4px;">Effekt: +${a.xp} XP Transformation</div>
                        </div>`).join('')}
                </div>
                <button class="btn btn-secondary" onclick="navigate('catalog')">Zurück</button>
            `;
            break;

        case 'do':
            const action = DATABASE[params.cat].actions[params.act];
            html = `
                <div class="emoji-hero">📡</div>
                <div class="title">${action.title}</div>
                <div class="subtitle" style="color:#fff; font-size:20px; font-weight:700;">${action.prompt}</div>
                
                <div class="science-box">
                    <span class="sci-tag">Biological mechanism</span>
                    <div class="sci-detail">
                        <span class="sci-label">Ursache</span>
                        <div class="sci-text">${action.why}</div>
                    </div>
                    <div class="sci-detail">
                        <span class="sci-label">Mechanismus</span>
                        <div class="sci-text">${action.mechanism}</div>
                    </div>
                    <div class="sci-detail">
                        <span class="sci-label">Nutzen</span>
                        <div class="sci-text" style="color:var(--accent); font-weight:700;">${action.benefit}</div>
                    </div>
                </div>

                <button class="btn" onclick="complete('${params.cat}', ${action.xp})">Protokoll abgeschlossen</button>
                <button class="btn btn-secondary" onclick="navigate('catalog')">Abbrechen</button>
            `;
            break;
    }

    newScreen.innerHTML = html;
    container.appendChild(newScreen);
    if(oldScreen) {
        oldScreen.style.opacity = '0';
        oldScreen.style.transform = 'translateY(-20px)';
        setTimeout(() => oldScreen.remove(), 600);
    }
    setTimeout(() => newScreen.classList.add('active'), 50);
}

function updateVal(key, val) {
    system[key] = parseFloat(val);
    const label = document.getElementById(`label-${key}`);
    if (label) label.innerText = (key === 'energy' ? val + '%' : key === 'sleep' ? val + 'h' : val);
}

function startScanAnimation() {
    navigate('scan');
}

function runScan() {
    system.hour = new Date().getHours();
    let match = SCAN_RULES.find(r => r.cond(system));
    if(!match) match = { res: { state: 'System Optimal', emoji: '💎', desc: 'Keine kritischen biologischen Abweichungen detektiert.', action: 'none' }};
    navigate('result', { res: match.res });
}

function complete(cat, xp) {
    system.xp[cat] += xp;
    system.streak++;
    save();
    navigate('home');
}

function save() { 
    localStorage.setItem('hn_v3', JSON.stringify(system)); 
    const streakEl = document.getElementById('global-streak');
    if (streakEl) streakEl.innerText = `🔥 ${system.streak} STREAK`;
}

function dismissLegal() {
    document.getElementById('legalBanner').classList.add('hidden');
    sessionStorage.setItem('legalDismissed', 'true');
}

document.addEventListener('DOMContentLoaded', () => {
    if (sessionStorage.getItem('legalDismissed')) dismissLegal();
    save();
    navigate('home');
});
</script>
</body>
</html>
