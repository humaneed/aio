<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HUMANEED | Flow Foundation</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   FLOW DESIGN v7 - Minimalist Dark
   ═══════════════════════════════════════════════════════════════════════════ */

:root {
  /* 🎨 Core */
  --bg-void: #050505;
  --glass: rgba(255,255,255,0.04);
  --glass-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  
  --text-main: #ededed;
  --text-dim: #888;
  --text-muted: #555;
  
  /* 🌊 Tier Colors */
  --c-tier0: #FF6B35; /* Bio */
  --c-tier1: #FFB84D; /* Struktur */
  --c-tier2: #4ECDC4; /* Sozial */
  --c-tier3: #95E1D3; /* Identität */
  --c-tier4: #A78BFA; /* Entwicklung */
  --c-tier5: #F38BA0; /* Bedeutung */
  
  /* 💎 Status */
  --c-green: #32D74B;
  --c-yellow: #FFD60A;
  --c-red: #FF453A;
  
  /* ⚡ Animation */
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-void);
  color: var(--text-main);
  font-family: 'Manrope', -apple-system, sans-serif;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════════════════════════════════════════════
   AMBIENCE & LAYOUT
   ═══════════════════════════════════════════════════════════════════════════ */

.ambience {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: radial-gradient(circle at 50% -20%, rgba(255,255,255,0.05), transparent 70%);
}

.app-container {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.header {
  padding: 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-weight: 700;
  letter-spacing: -0.02em;
  font-size: 1rem;
  opacity: 0.6;
  cursor: pointer;
  transition: opacity 0.3s;
}

.brand:hover {
  opacity: 1;
}

.status-pill {
  font-size: 0.75rem;
  background: var(--glass);
  padding: 4px 12px;
  border-radius: 20px;
  color: var(--text-dim);
  border: 1px solid var(--border);
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEW SYSTEM
   ═══════════════════════════════════════════════════════════════════════════ */

.viewport {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.view {
  position: absolute;
  inset: 0;
  padding: 0 1.5rem 2rem;
  overflow-y: auto;
  overflow-x: hidden;
  transition: transform 0.6s var(--ease), opacity 0.5s ease;
  opacity: 0;
  transform: scale(0.95);
  pointer-events: none;
}

.view.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.view::-webkit-scrollbar {
  width: 0;
}

/* ═══════════════════════════════════════════════════════════════════════════
   TYPOGRAPHY
   ═══════════════════════════════════════════════════════════════════════════ */

h1 {
  font-size: 1.8rem;
  font-weight: 300;
  margin-bottom: 0.5rem;
}

.sub {
  color: var(--text-dim);
  margin-bottom: 2rem;
  font-size: 0.9rem;
}

/* ═══════════════════════════════════════════════════════════════════════════
   BUTTONS & UI
   ═══════════════════════════════════════════════════════════════════════════ */

.btn {
  background: var(--glass);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 16px;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s var(--ease);
  text-align: center;
  font-family: inherit;
  display: block;
  width: 100%;
}

.btn:active { transform: scale(0.98); }

.btn-primary {
  background: #fff;
  color: #000;
  border: none;
  font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════════════════════
   ANAMNESE STYLES (NEU)
   ═══════════════════════════════════════════════════════════════════════════ */
   
.ana-progress-container {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 2rem;
  overflow: hidden;
}

.ana-progress-bar {
  height: 100%;
  width: 0%;
  background: var(--c-green);
  transition: width 0.4s var(--ease);
}

.ana-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ana-option {
  text-align: left;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ana-selected {
  border-color: var(--c-green);
  background: rgba(50,215,75,0.1);
  color: #fff;
}

.ana-nav {
  margin-top: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ═══════════════════════════════════════════════════════════════════════════
   HOME & RECOMMENDATIONS (NEU)
   ═══════════════════════════════════════════════════════════════════════════ */

.rec-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 1rem;
  margin: 0 -1.5rem 2rem; /* Bleed layout */
  padding: 0 1.5rem 1rem;
  scrollbar-width: none;
}
.rec-scroll::-webkit-scrollbar { display: none; }

.rec-card {
  min-width: 220px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.2rem;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.rec-reason {
  font-size: 0.75rem;
  color: var(--c-green);
  margin-bottom: 6px;
}

.rec-title {
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 12px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SCORE RING
   ═══════════════════════════════════════════════════════════════════════════ */

.score-container { text-align: center; margin: 2rem 0; }
.score-ring { position: relative; width: 180px; height: 180px; margin: 0 auto 1.5rem; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--glass); stroke-width: 10; }
.ring-progress { 
  fill: none; stroke: var(--c-green); stroke-width: 10; stroke-linecap: round; 
  stroke-dasharray: 565; stroke-dashoffset: 565; transition: stroke-dashoffset 1s var(--ease);
}
.score-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.score-value { font-size: 2.5rem; font-weight: 300; line-height: 1; }
.score-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim); margin-top: 5px; }

/* ═══════════════════════════════════════════════════════════════════════════
   TIER GRID
   ═══════════════════════════════════════════════════════════════════════════ */

.tier-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 4rem;}
.tier-card {
  aspect-ratio: 1.1;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}
.tier-card:hover { background: var(--glass-hover); transform: translateY(-3px); }
.tier-emoji { font-size: 2rem; margin-bottom: 0.5rem; }
.tier-name { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
.tier-score { font-size: 0.9rem; font-weight: 600; margin-top: 4px; }

/* ═══════════════════════════════════════════════════════════════════════════
   SHEET
   ═══════════════════════════════════════════════════════════════════════════ */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: flex-end; opacity: 0; transition: opacity 0.3s; }
.overlay.active { display: flex; opacity: 1; }
.sheet { width: 100%; max-width: 480px; margin: 0 auto; background: #111; border-top: 1px solid #333; border-radius: 24px 24px 0 0; padding: 2rem; transform: translateY(100%); transition: transform 0.4s var(--ease); max-height: 90vh; overflow-y: auto; }
.overlay.active .sheet { transform: translateY(0); }

</style>
</head>
<body>

<div class="ambience"></div>

<div class="app-container">
  <header class="header">
    <div class="brand" onclick="navigate('viewHome')">HUMANEED</div>
    <div class="status-pill" onclick="startAnamnesis()">👤 Profil</div>
  </header>

  <div class="viewport">
  
    <div class="view active" id="viewHome">
      
      <div id="recommendationsContainer">
        </div>

      <div class="score-container">
        <div class="score-ring">
          <svg viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="90" />
            <circle class="ring-progress" cx="100" cy="100" r="90" id="scoreRing" />
          </svg>
          <div class="score-content">
            <div class="score-value" id="scoreValue">0</div>
            <div class="score-label">Flow Level</div>
          </div>
        </div>
        <p class="sub" id="scoreMsg">Sammle XP in den Dimensionen</p>
      </div>
      
      <div class="tier-grid" id="tierGrid"></div>
    </div>

    <div class="view" id="viewAnamnesis">
      <div class="ana-progress-container">
        <div class="ana-progress-bar" id="anaProgress"></div>
      </div>
      
      <h1 id="anaQuestion">Frage</h1>
      <p class="sub" id="anaSub">Klicke alles an, was passt</p>
      
      <div class="ana-options" id="anaOptions">
        </div>
      
      <div class="ana-nav">
        <button class="btn" style="width: auto; padding: 10px 20px; opacity: 0.6;" onclick="navigate('viewHome')">Später</button>
        <button class="btn btn-primary" style="width: auto; padding: 10px 30px;" onclick="nextQuestion()">Weiter →</button>
      </div>
    </div>

    <div class="view" id="viewSkills">
      <h1 id="skillTierTitle">Dimension</h1>
      <div class="ana-options" id="skillList" style="margin-top: 1rem;"></div>
      <button class="btn" style="margin-top: 2rem;" onclick="navigate('viewHome')">Zurück</button>
    </div>

    <div class="view" id="viewSuccess" style="text-align: center; padding-top: 4rem;">
      <div style="font-size: 5rem; margin-bottom: 1rem;">🎉</div>
      <h1>Großartig!</h1>
      <div style="font-size: 2rem; color: var(--c-green); margin-bottom: 2rem;" id="successPoints">+0 XP</div>
      <p class="sub" id="synergyMsg" style="opacity: 0.7;">...</p>
      <button class="btn btn-primary" onclick="navigate('viewHome')">Weiter</button>
    </div>

  </div> <div class="overlay" id="skillOverlay" onclick="closeSheet(event)">
    <div class="sheet">
      <div style="font-size: 0.8rem; color: var(--c-green); text-transform: uppercase; margin-bottom: 10px;" id="sheetTier">DIMENSION</div>
      <h1 id="sheetTitle" style="font-size: 1.8rem; margin-bottom: 1rem;">Titel</h1>
      <p style="font-size: 1rem; line-height: 1.6; color: #ccc; margin-bottom: 2rem;" id="sheetDesc">Beschreibung</p>
      
      <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 12px; margin-bottom: 2rem;">
        <div style="font-weight: 700; margin-bottom: 5px;">⚡ Warum jetzt?</div>
        <div style="font-size: 0.9rem; color: #aaa;" id="sheetReason">Diese Übung passt zu deinem aktuellen Fokus.</div>
      </div>
      
      <button class="btn btn-primary" onclick="doSkill()">Erledigt (+XP)</button>
      <button class="btn" style="margin-top: 10px; border: none; background: transparent;" onclick="closeSheet(null, true)">Abbrechen</button>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 🧬 DATEN & KONFIGURATION
// ─────────────────────────────────────────────────────────────────────────────

// Die neuen, deskriptiven Anamnese-Fragen
const ANAMNESIS_DATA = [
  {
    id: "phase",
    question: "In welcher Lebensphase bist du?",
    type: "single",
    options: [
      { value: "student", label: "🎓 Student/in, Ausbildung" },
      { value: "berufsstart", label: "🚀 Berufsstart, unter 30" },
      { value: "etabliert", label: "⚓ Etabliert, 30-45" },
      { value: "mid_life", label: "⚖️ Mitte des Lebens, 45-60" },
      { value: "senior", label: "🌳 Erfahren, 60+" }
    ]
  },
  {
    id: "alltag",
    question: "Wie sieht dein typischer Tag aus?",
    type: "multi",
    options: [
      { value: "viel_sitzen", label: "🪑 Viel Sitzen" },
      { value: "viel_bewegung", label: "🏃 Viel in Bewegung" },
      { value: "bildschirm", label: "💻 Viel Bildschirmzeit" },
      { value: "menschen", label: "🗣️ Viel mit Menschen" },
      { value: "allein", label: "🐺 Viel allein" },
      { value: "strukturiert", label: "📅 Sehr strukturiert" },
      { value: "flexibel", label: "🌊 Flexibel / Chaotisch" },
      { value: "zeitdruck", label: "⏱️ Oft unter Zeitdruck" }
    ]
  },
  {
    id: "zustand",
    question: "Wie würdest du deinen aktuellen Zustand beschreiben?",
    type: "multi",
    options: [
      { value: "erschoepft", label: "🔋 Oft erschöpft" },
      { value: "energiegeladen", label: "⚡ Energiegeladen" },
      { value: "schlaf_schlecht", label: "😴 Schlaf könnte besser sein" },
      { value: "gestresst", label: "🤯 Oft gestresst" },
      { value: "gruebelnd", label: "🤔 Viel Grübeln" },
      { value: "einsam", label: "🌑 Manchmal einsam" },
      { value: "suchend", label: "🧭 Suche Sinn / Richtung" }
    ]
  },
  {
    id: "prioritaeten",
    question: "Was ist dir gerade am wichtigsten? (Max 3)",
    type: "multi",
    max: 3,
    options: [
      { value: "mehr_energie", label: "⚡ Mehr Energie" },
      { value: "weniger_stress", label: "🧘 Weniger Stress" },
      { value: "verbindung", label: "🤝 Verbindung / Nähe" },
      { value: "klarheit", label: "👁️ Klarheit & Fokus" },
      { value: "sinn", label: "🌟 Sinn finden" }
    ]
  }
];

// Dimensionen (Tiers)
const TIERS = [
  { id: 'bio', name: 'Biologie', icon: '💪', color: 'var(--c-tier0)' },
  { id: 'struktur', name: 'Struktur', icon: '🏠', color: 'var(--c-tier1)' },
  { id: 'sozial', name: 'Soziales', icon: '❤️', color: 'var(--c-tier2)' },
  { id: 'identitaet', name: 'Identität', icon: '⭐', color: 'var(--c-tier3)' },
  { id: 'entwicklung', name: 'Entwicklung', icon: '🚀', color: 'var(--c-tier4)' },
  { id: 'bedeutung', name: 'Bedeutung', icon: '🌟', color: 'var(--c-tier5)' }
];

// Beispiel-Skills (Basis-Datenbank)
const SKILLS_DB = [
  { id: '478_breath', name: '4-7-8 Atmung', tier: 'bio', xp: 30, desc: '90 Sekunden Reset für das Nervensystem.', tags: ['stress', 'erschoepft'] },
  { id: 'water', name: 'Glas Wasser', tier: 'bio', xp: 15, desc: 'Hydrierung für sofortige Klarheit.', tags: ['erschoepft'] },
  { id: 'walk_10', name: '10 Min Spaziergang', tier: 'bio', xp: 50, desc: 'Bewegung baut Stresshormone ab.', tags: ['viel_sitzen', 'stress'] },
  { id: 'dump_journal', name: 'Gedanken-Dump', tier: 'identitaet', xp: 40, desc: 'Alles aufschreiben, was im Kopf kreist.', tags: ['gruebelnd', 'gestresst'] },
  { id: 'msg_friend', name: 'Nachricht senden', tier: 'sozial', xp: 30, desc: 'Eine kurze Verbindung herstellen.', tags: ['einsam', 'verbindung'] },
  { id: '3_wins', name: '3 Tages-Wins', tier: 'struktur', xp: 25, desc: 'Fokus auf das Gelungene.', tags: ['suchend', 'negativ'] },
  { id: 'values', name: 'Werte-Check', tier: 'bedeutung', xp: 60, desc: 'Lebe ich heute nach meinen Werten?', tags: ['sinn', 'suchend'] }
];

// ─────────────────────────────────────────────────────────────────────────────
// 🧠 STATE & LOGIC
// ─────────────────────────────────────────────────────────────────────────────

let state = {
  xp: 0,
  level: 1,
  profile: {},      // Anamnese Daten
  history: [],      // Erledigte Skills
  recommendations: [], // Berechnete Empfehlungen
  synergyContext: {}, // Versteckte Multiplikatoren
  currentSkill: null
};

// Analyse-Logik (Das Herzstück)
function analyzeProfile() {
  const p = state.profile;
  const recs = [];
  
  if (!p || Object.keys(p).length === 0) {
    state.recommendations = [];
    return;
  }
  
  // 1. Muster erkennen
  const patterns = {
    exhausted: p.zustand?.includes('erschoepft') || p.zustand?.includes('schlaf_schlecht'),
    isolated: p.zustand?.includes('einsam') || p.alltag?.includes('allein'),
    stressed: p.zustand?.includes('gestresst') || p.alltag?.includes('zeitdruck'),
    sedentary: p.alltag?.includes('viel_sitzen') || p.alltag?.includes('bildschirm')
  };
  
  // 2. Synergy Context berechnen (Einflussfaktoren)
  state.synergyContext = {
    energy_low: patterns.exhausted,
    social_low: patterns.isolated,
    stress_high: patterns.stressed
  };

  // 3. Empfehlungen generieren (Smart Recommendations)
  
  // Bei Erschöpfung/Stress -> Bio-Skills priorisieren
  if (patterns.exhausted || patterns.stressed) {
    recs.push({
      skillId: '478_breath',
      reason: "Nervensystem beruhigen",
      priority: 1
    });
    recs.push({
      skillId: 'walk_10',
      reason: "Stresshormone abbauen",
      priority: 2
    });
  }
  
  // Bei Grübeln -> Identität/Struktur
  if (p.zustand?.includes('gruebelnd')) {
    recs.push({
      skillId: 'dump_journal',
      reason: "Kopf frei bekommen",
      priority: 1
    });
  }

  // Bei Isolation -> Sozial
  if (patterns.isolated) {
    recs.push({
      skillId: 'msg_friend',
      reason: "Verbindung stärken",
      priority: 1
    });
  }

  // Fallback
  if (recs.length === 0) {
    recs.push({ skillId: 'water', reason: "Basis-Versorgung", priority: 3 });
  }

  state.recommendations = recs.sort((a,b) => a.priority - b.priority);
  renderHome();
}

// Berechnet XP basierend auf Kontext (Synergie)
function calculateSynergyXP(baseXP, tierId) {
  let multiplier = 1.0;
  const ctx = state.synergyContext;
  let msg = "Gute Arbeit!";

  // Logik: Wenn man erschöpft ist, geben Bio-Skills mehr Belohnung (Selbstfürsorge),
  // aber komplexe Entwicklungs-Skills vielleicht weniger (weil weniger effektiv).
  
  if (tierId === 'bio' && ctx.energy_low) {
    multiplier = 1.5; // Bonus für Selbstfürsorge
    msg = "Wichtige Selbstfürsorge! (+50% Bonus)";
  }
  
  if (tierId === 'entwicklung' && ctx.stress_high) {
    multiplier = 0.8; // Schwer zu lernen unter Stress
    msg = "Trotz Stress erledigt (Resilienz)";
  }

  return { xp: Math.round(baseXP * multiplier), msg };
}

// ─────────────────────────────────────────────────────────────────────────────
// 📱 CONTROLLER & NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────

function init() {
  // Load State from LocalStorage
  const saved = localStorage.getItem('humaneed_state_v2');
  if (saved) {
    state = JSON.parse(saved);
    analyzeProfile(); // Re-Analyse beim Laden
  }
  renderHome();
}

function saveState() {
  localStorage.setItem('humaneed_state_v2', JSON.stringify(state));
}

function navigate(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
}

// ─────────────────────────────────────────────────────────────────────────────
// 🖥️ UI RENDERING
// ─────────────────────────────────────────────────────────────────────────────

function renderHome() {
  // 1. Score Ring
  const totalXP = state.xp;
  const maxXP = state.level * 500;
  const pct = Math.min((totalXP / maxXP) * 100, 100);
  const ring = document.getElementById('scoreRing');
  const circumference = 2 * Math.PI * 90;
  
  ring.style.strokeDasharray = `${circumference} ${circumference}`;
  ring.style.strokeDashoffset = circumference - (pct / 100) * circumference;
  
  document.getElementById('scoreValue').textContent = state.level;
  
  // 2. Smart Recommendations Area
  const recContainer = document.getElementById('recommendationsContainer');
  
  // Zeige Anamnese-Einladung wenn Profil leer
  if (!state.profile || Object.keys(state.profile).length === 0) {
    recContainer.innerHTML = `
      <div style="margin: 0 1.5rem 2rem;">
        <div class="btn" onclick="startAnamnesis()" style="display:flex; justify-content:space-between; align-items:center; text-align:left;">
          <div>
            <div style="font-weight:700;">Profil erstellen</div>
            <div style="font-size:0.8rem; color:var(--text-dim);">Für smarte Empfehlungen</div>
          </div>
          <span style="font-size:1.5rem">👤</span>
        </div>
      </div>
    `;
  } 
  // Oder zeige Empfehlungen
  else if (state.recommendations.length > 0) {
    let html = `
      <div style="margin: 0 1.5rem 0.5rem; font-size: 0.7rem; text-transform:uppercase; color:var(--text-dim); letter-spacing:1px; font-weight:700;">💡 FÜR DICH EMPFOHLEN</div>
      <div class="rec-scroll">`;
      
    state.recommendations.forEach(rec => {
      const skill = SKILLS_DB.find(s => s.id === rec.skillId);
      if (!skill) return;
      html += `
        <div class="rec-card" onclick="openSkill('${skill.id}', '${rec.reason}')">
          <div class="rec-reason">${rec.reason}</div>
          <div class="rec-title">${skill.name}</div>
          <div class="btn-primary" style="padding:6px 12px; font-size:0.8rem; border-radius:8px; width:auto; display:inline-block;">Jetzt machen</div>
        </div>
      `;
    });
    html += `</div>`;
    recContainer.innerHTML = html;
  } else {
    recContainer.innerHTML = '';
  }

  // 3. Tier Grid
  const grid = document.getElementById('tierGrid');
  grid.innerHTML = '';
  TIERS.forEach(tier => {
    // Check if skills available
    const count = SKILLS_DB.filter(s => s.tier === tier.id).length;
    const card = document.createElement('div');
    card.className = 'tier-card';
    card.innerHTML = `
      <div class="tier-emoji">${tier.icon}</div>
      <div class="tier-name">${tier.name}</div>
      <div class="tier-score" style="color:${tier.color}">${count} Skills</div>
    `;
    card.onclick = () => openTier(tier.id);
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// 🧬 ANAMNESE LOGIC
// ─────────────────────────────────────────────────────────────────────────────

let anaIndex = 0;
let anaTempAnswers = {};

function startAnamnesis() {
  anaIndex = 0;
  anaTempAnswers = {};
  navigate('viewAnamnesis');
  renderQuestion();
}

function renderQuestion() {
  const q = ANAMNESIS_DATA[anaIndex];
  if (!q) {
    // Ende erreicht
    state.profile = { ...state.profile, ...anaTempAnswers };
    analyzeProfile(); // Neu berechnen
    saveState();
    navigate('viewHome');
    return;
  }

  document.getElementById('anaQuestion').textContent = q.question;
  
  // Progress Bar
  const pct = ((anaIndex) / ANAMNESIS_DATA.length) * 100;
  document.getElementById('anaProgress').style.width = `${pct}%`;

  const container = document.getElementById('anaOptions');
  container.innerHTML = '';

  q.options.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'btn ana-option';
    btn.innerHTML = `<span>${opt.label}</span>`;
    
    // Check Status
    const val = anaTempAnswers[q.id];
    const isSelected = Array.isArray(val) ? val.includes(opt.value) : val === opt.value;
    
    if (isSelected) {
      btn.classList.add('ana-selected');
      btn.innerHTML += `<span>✓</span>`;
    }

    btn.onclick = () => selectAnaOption(q.id, opt.value, q.type, q.max);
    container.appendChild(btn);
  });
}

function selectAnaOption(qId, value, type, max) {
  if (type === 'single') {
    anaTempAnswers[qId] = value;
    setTimeout(nextQuestion, 150);
  } else {
    if (!anaTempAnswers[qId]) anaTempAnswers[qId] = [];
    const arr = anaTempAnswers[qId];
    
    if (arr.includes(value)) {
      anaTempAnswers[qId] = arr.filter(v => v !== value);
    } else {
      if (max && arr.length >= max) return;
      arr.push(value);
    }
    renderQuestion();
  }
}

function nextQuestion() {
  anaIndex++;
  renderQuestion();
}

// ─────────────────────────────────────────────────────────────────────────────
// 🛠️ SKILL EXECUTION
// ─────────────────────────────────────────────────────────────────────────────

function openTier(tierId) {
  const tier = TIERS.find(t => t.id === tierId);
  document.getElementById('skillTierTitle').textContent = `${tier.icon} ${tier.name}`;
  
  const list = document.getElementById('skillList');
  list.innerHTML = '';
  
  const skills = SKILLS_DB.filter(s => s.tier === tierId);
  skills.forEach(s => {
    const el = document.createElement('div');
    el.className = 'btn ana-option';
    el.innerHTML = `<div><div style="font-weight:700">${s.name}</div><div style="font-size:0.8rem; opacity:0.7">${s.desc}</div></div><div>${s.xp} XP</div>`;
    el.onclick = () => openSkill(s.id);
    list.appendChild(el);
  });
  
  navigate('viewSkills');
}

function openSkill(skillId, reason = null) {
  const skill = SKILLS_DB.find(s => s.id === skillId);
  state.currentSkill = skill;
  
  document.getElementById('sheetTitle').textContent = skill.name;
  document.getElementById('sheetDesc').textContent = skill.desc;
  document.getElementById('sheetTier').textContent = skill.tier.toUpperCase();
  
  // Grund anzeigen (Warum jetzt?)
  const reasonEl = document.getElementById('sheetReason');
  if (reason) {
    reasonEl.textContent = `💡 ${reason}`;
    reasonEl.style.color = "var(--c-green)";
  } else {
    reasonEl.textContent = "Eine gute Übung für zwischendurch.";
    reasonEl.style.color = "#aaa";
  }
  
  document.getElementById('skillOverlay').classList.add('active');
}

function closeSheet(e, force = false) {
  if (force || e.target.id === 'skillOverlay') {
    document.getElementById('skillOverlay').classList.remove('active');
  }
}

function doSkill() {
  closeSheet(null, true);
  const skill = state.currentSkill;
  
  // SYNERGY BERECHNUNG
  const result = calculateSynergyXP(skill.xp, skill.tier);
  
  state.xp += result.xp;
  state.history.push({ id: skill.id, date: new Date().toISOString() });
  
  // Level Up Check
  if (state.xp >= state.level * 500) {
    state.level++;
  }
  
  saveState();
  
  // Success View
  document.getElementById('successPoints').textContent = `+${result.xp} XP`;
  document.getElementById('synergyMsg').textContent = result.msg;
  navigate('viewSuccess');
}

// Start
init();

</script>
