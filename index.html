<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>humaneed App v2 - Interaktiv</title>
<style>
  body{margin:0;padding:0;font-family:sans-serif;background:#000;color:#fff;}
  .container{max-width:500px;margin:0 auto;padding:24px;min-height:100vh;display:flex;flex-direction:column;}
  .state-display,.impulses,.feedback,.data-view{margin-bottom:32px;}
  .state-emoji{font-size:48px;text-align:center;}
  .state-name{font-size:32px;text-align:center;margin:12px 0;}
  .state-desc{font-size:16px;text-align:center;color:#aaa;}
  .state-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .state-option{background:#111;padding:12px 16px;border-radius:8px;cursor:pointer;text-align:center;flex:1 0 40%;}
  .impulse-card{background:#111;padding:16px;border-radius:8px;margin-bottom:12px;cursor:pointer;}
  .feedback-btn{background:#111;padding:12px;border-radius:8px;cursor:pointer;margin:4px;}
  .bottom-nav{display:flex;gap:12px;margin-top:auto;}
  .nav-btn{flex:1;padding:12px;background:#111;border-radius:8px;cursor:pointer;text-align:center;}
  .nav-btn.active{background:#222;color:#0f0;}
  .hidden{display:none;}
  input[type="range"],input[type="number"]{width:100%;margin-top:8px;}
  .dots{display:flex;gap:4px;margin-top:8px;justify-content:center;}
  .dot{width:16px;height:16px;border-radius:50%;background:#222;cursor:pointer;}
  .dot.active{background:#0f0;}
</style>
</head>
<body>
<div class="container">
  <div id="flowView">
    <div class="state-display" id="stateDisplay"></div>
    <div class="state-options" id="quickCorrection"></div>
    <div class="impulses" id="impulsesSection"></div>
    <div class="feedback hidden" id="feedbackSection"></div>
  </div>

  <div id="dataView" class="hidden"></div>

  <div class="bottom-nav">
    <div class="nav-btn active" onclick="showView('flow', this)">🎯 Flow</div>
    <div class="nav-btn" onclick="showView('data', this)">📊 Daten</div>
  </div>
</div>

<script>
const STATES={
  exhausted:{name:'Erschöpft',emoji:'😴',desc:'Körper & Geist brauchen Pause'},
  restless:{name:'Unruhig',emoji:'😰',desc:'Innere Spannung'},
  empty:{name:'Leer',emoji:'😶',desc:'Antriebslos'},
  clear:{name:'Klar',emoji:'✨',desc:'Fokussiert'},
  stable:{name:'Stabil',emoji:'🟢',desc:'Alles im Gleichgewicht'}
};

const IMPULSES={
  water_now:{name:'Wasser trinken',desc:'Glas Wasser trinken',states:['exhausted','empty'],effect:{water:1,energy:5}},
  breath_478:{name:'4-7-8 Atmung',desc:'Atme tief ein, halte, aus',states:['restless'],effect:{energy:10}},
  movement_burst:{name:'Bewegung',desc:'Körper kurz bewegen',states:['empty'],effect:{activity:5,energy:10}}
};

const system={water:2,sleep:7,activity:0,energy:50,currentState:null,lastImpulse:null,history:[]};

function calculateState(){
  if(system.sleep<6)return'exhausted';
  if(system.activity===0 && system.energy<40)return'empty';
  if(system.activity>0 && system.energy>60)return'clear';
  return'stable';
}

function renderFlow(){
  system.currentState=calculateState();
  const s=STATES[system.currentState];
  document.getElementById('stateDisplay').innerHTML=
    `<div class="state-emoji">${s.emoji}</div>
     <div class="state-name">${s.name}</div>
     <div class="state-desc">${s.desc}</div>`;

  const otherStates=Object.keys(STATES).filter(k=>k!==system.currentState);
  document.getElementById('quickCorrection').innerHTML=
    otherStates.map(k=>`<div class="state-option" onclick="correctState('${k}')">${STATES[k].emoji}<br>${STATES[k].name}</div>`).join('');

  const impulses=Object.entries(IMPULSES).filter(([k,v])=>v.states.includes(system.currentState));
  document.getElementById('impulsesSection').innerHTML=impulses.map(([k,v])=>
    `<div class="impulse-card" onclick="executeImpulse('${k}')">
      <strong>${v.name}</strong><br>${v.desc}
    </div>`).join('');

  document.getElementById('feedbackSection').classList.add('hidden');
}

function correctState(stateKey){system.currentState=stateKey;renderFlow();}

function executeImpulse(impulseKey){
  const i=IMPULSES[impulseKey];system.lastImpulse=impulseKey;
  if(i.effect.water)system.water=Math.min(8,system.water+i.effect.water);
  if(i.effect.activity)system.activity+=i.effect.activity;
  if(i.effect.energy)system.energy=Math.min(100,system.energy+i.effect.energy);
  showFeedback();
}

function showFeedback(){
  const f=document.getElementById('feedbackSection');f.classList.remove('hidden');
  f.innerHTML=`<div>Wie fühlst du dich jetzt?</div>
    <div>
      <button class="feedback-btn" onclick="handleFeedback('better')">✅ Besser</button>
      <button class="feedback-btn" onclick="handleFeedback('same')">➖ Gleich</button>
      <button class="feedback-btn" onclick="handleFeedback('worse')">⬇️ Schlechter</button>
    </div>`;
}

function handleFeedback(r){
  if(r==='better')system.energy=Math.min(100,system.energy+10);
  if(r==='worse')system.energy=Math.max(0,system.energy-10);
  renderFlow();
}

function renderDataView(){
  const container=document.getElementById('dataView');
  container.innerHTML=`
    <div>Wasser:</div>
    <div class="dots" id="waterDots"></div>
    <div>Schlaf: ${system.sleep}h</div>
    <input type="range" min="0" max="12" step="0.5" value="${system.sleep}" oninput="updateSleep(this.value)">
    <div>Aktivität: ${system.activity} Min</div>
    <input type="number" value="${system.activity}" oninput="updateActivity(this.value)">
    <div>Energie: ${system.energy}%</div>
    <div>Zustand: ${STATES[system.currentState].name}</div>`;
  renderWaterDots();
}

function renderWaterDots(){
  const container=document.getElementById('waterDots');
  container.innerHTML='';
  for(let i=0;i<8;i++){
    const dot=document.createElement('div');
    dot.className='dot'+(i<system.water?' active':'');
    dot.onclick=()=>{system.water=i+1;renderDataView();};
    container.appendChild(dot);
  }
}

function updateSleep(v){system.sleep=parseFloat(v);renderDataView();}
function updateActivity(v){system.activity=parseInt(v)||0;renderDataView();}

function showView(view, btn){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(view==='flow'){document.getElementById('flowView').classList.remove('hidden');document.getElementById('dataView').classList.add('hidden');renderFlow();}
  else{document.getElementById('flowView').classList.add('hidden');document.getElementById('dataView').classList.remove('hidden');renderDataView();}
}

renderFlow();
</script>
</body>
</html>
