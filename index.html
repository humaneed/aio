<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>humaneed - Vertical Flow</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000;color:#fff;line-height:1.5;}
  .flow-container{max-width:500px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:32px;}

  .block{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:12px;padding:20px;position:relative;transition:all 0.2s;}
  .block h2{font-size:18px;margin-bottom:12px;color:#fff;}
  .block p{font-size:14px;color:#999;margin-bottom:12px;}

  .state-block{text-align:center;}
  .state-emoji{font-size:64px;margin-bottom:12px;}
  .state-name{font-size:32px;font-weight:300;margin-bottom:6px;}

  .impulse-list{display:flex;flex-direction:column;gap:12px;}
  .impulse-card{border:1px solid #1a1a1a;border-radius:10px;padding:16px;cursor:pointer;transition:all 0.2s;}
  .impulse-card:active{transform:scale(0.98);}
  .impulse-name{font-size:16px;font-weight:500;}
  .impulse-desc{font-size:14px;color:#999;margin-top:4px;}
  .impulse-impact{font-size:12px;color:#666;margin-top:8px;border-top:1px solid #1a1a1a;padding-top:4px;}

  .maslow-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .slider{width:70%;}
  input[type="number"]{width:70px;background:#000;border:1px solid #1a1a1a;color:#fff;padding:6px;border-radius:6px;}

  .budget-row{display:flex;justify-content:space-between;margin-top:8px;}
  .good{color:#00ff00;}
  .warning{color:#ff6b35;}

  .feedback-options{display:flex;justify-content:space-around;margin-top:12px;}
  .feedback-btn{padding:12px 16px;border-radius:8px;border:1px solid #1a1a1a;background:#0a0a0a;color:#fff;cursor:pointer;transition:all 0.2s;}
  .feedback-btn:active{transform:scale(0.95);}

  .timer-display{font-size:14px;color:#0f0;margin-top:6px;text-align:center;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="flow-container" id="flowContainer">
  <!-- Dynamische Blöcke werden hier erzeugt -->
</div>
<script>
// =====================================
// SYSTEM STATE
// =====================================
const system={water:0,sleep:7,activity:0,budget:30,spent:0,energy:50,currentState:null,lastImpulse:null,history:[]};

const STATES={
  exhausted:{name:'Erschöpft',emoji:'😴',desc:'Körper und Geist brauchen Pause',triggers:{sleep:'<6',water:'<3',activity:'>60'}},
  restless:{name:'Unruhig',emoji:'😰',desc:'Innere Spannung',triggers:{sleep:'<5',activity:'0'}},
  overwhelmed:{name:'Überladen',emoji:'🤯',desc:'Zu viele offene Schleifen',triggers:{budget:'<5',activity:'0'}},
  empty:{name:'Leer',emoji:'😶',desc:'Antriebslos',triggers:{activity:'0',water:'<4'}},
  clear:{name:'Klar',emoji:'✨',desc:'Fokussiert',triggers:{sleep:'>=7',water:'>=6',activity:'>0'}},
  blocked:{name:'Blockiert',emoji:'🧱',desc:'Festgefahren',triggers:{activity:'0'}},
  stable:{name:'Stabil',emoji:'🟢',desc:'Grundbedürfnisse erfüllt',triggers:{sleep:'>=7',water:'>=5',budget:'>10'}},
  tense:{name:'Angespannt',emoji:'😬',desc:'Körperlich verkrampft',triggers:{activity:'0',sleep:'<6'}}
};

const IMPULSES={
  breath_478:{name:'4-7-8 Atmung',desc:'Einatmen 4 Sek, halten 7 Sek, ausatmen 8 Sek. 3x wiederholen.',time:'90 Sek',energy:'niedrig',impact:'Beruhigt Nervensystem',states:['restless','tense','overwhelmed'],effect:{state:'stable',energy:10}},
  water_now:{name:'Wasser trinken',desc:'Ein Glas Wasser trinken.',time:'30 Sek',energy:'niedrig',impact:'Hydration verbessert Konzentration',states:['exhausted','empty','blocked'],effect:{water:1,energy:5}},
  movement_burst:{name:'Bewegungs-Burst',desc:'Arme kreisen, auf der Stelle laufen.',time:'2 Min',energy:'mittel',impact:'Aktiviert Kreislauf',states:['empty','blocked','tense'],effect:{activity:2,energy:15}}
};

// =====================================
// STATE CALCULATION
// =====================================
function calculateState(){
  let scores={};
  for(let [key,state] of Object.entries(STATES)){
    let score=0;
    if(state.triggers.sleep){if(state.triggers.sleep.includes('<')){if(system.sleep<parseFloat(state.triggers.sleep.replace('<','')))score+=3;}else if(state.triggers.sleep.includes('>=')){if(system.sleep>=parseFloat(state.triggers.sleep.replace('>=','')))score+=3;}}
    if(state.triggers.water){if(state.triggers.water.includes('<')){if(system.water<parseFloat(state.triggers.water.replace('<','')))score+=2;}else if(state.triggers.water.includes('>=')){if(system.water>=parseFloat(state.triggers.water.replace('>=','')))score+=2;}}
    if(state.triggers.activity){if(state.triggers.activity==='0'&&system.activity===0)score+=2;else if(state.triggers.activity.includes('>')){if(system.activity>parseFloat(state.triggers.activity.replace('>','')))score+=2;}}
    if(state.triggers.budget){const remaining=system.budget-system.spent;if(state.triggers.budget.includes('<')){if(remaining<parseFloat(state.triggers.budget.replace('<','')))score+=2;}else if(state.triggers.budget.includes('>')){if(remaining>parseFloat(state.triggers.budget.replace('>','')))score+=1;}}
    scores[key]=score;
  }
  let best=Object.entries(scores).reduce((a,b)=>a[1]>b[1]?a:b);
  if(best[1]===0)return 'empty';
  return best[0];
}

function getImpulsesForState(stateKey){
  return Object.values(IMPULSES).filter(i=>i.states.includes(stateKey)).slice(0,3);
}

// =====================================
// RENDER FLOW
// =====================================
function renderFlow(){
  const container=document.getElementById('flowContainer');
  container.innerHTML='';
  const stateKey=calculateState();
  system.currentState=stateKey;
  const state=STATES[stateKey];

  // Zustand Block
  const stateBlock=document.createElement('div');
  stateBlock.className='block state-block';
  stateBlock.innerHTML=`<div class="state-emoji">${state.emoji}</div><div class="state-name">${state.name}</div><p>${state.desc}</p>`;
  container.appendChild(stateBlock);

  // Impulse Block
  const impulses=getImpulsesForState(stateKey);
  if(impulses.length>0){
    const impulseBlock=document.createElement('div');
    impulseBlock.className='block';
    impulseBlock.innerHTML='<h2>Was jetzt hilft</h2>';
    const list=document.createElement('div'); list.className='impulse-list';
    impulses.forEach(imp=>{
      const card=document.createElement('div'); card.className='impulse-card';
      card.innerHTML=`<div class="impulse-name">${imp.name}</div><div class="impulse-desc">${imp.desc}</div><div class="impulse-impact">→ ${imp.impact}</div>`;
      card.onclick=()=>executeImpulse(imp.name,imp.effect);
      list.appendChild(card);
    });
    impulseBlock.appendChild(list);
    container.appendChild(impulseBlock);
  }

  // Maslow Block
  const maslowBlock=document.createElement('div');
  maslowBlock.className='block';
  maslowBlock.innerHTML='<h2>Maslow-Bedürfnisse</h2>';
  const waterRow=document.createElement('div'); waterRow.className='maslow-row';
  waterRow.innerHTML=`<label>Wasser: ${system.water}/8</label><input type="range" min="0" max="8" value="${system.water}" class="slider" oninput="updateWater(this.value)">`;
  maslowBlock.appendChild(waterRow);
  const sleepRow=document.createElement('div'); sleepRow.className='maslow-row';
  sleepRow.innerHTML=`<label>Schlaf: ${system.sleep}h</label><input type="range" min="0" max="12" step="0.5" value="${system.sleep}" class="slider" oninput="updateSleep(this.value)">`;
  maslowBlock.appendChild(sleepRow);
  const actRow=document.createElement('div'); actRow.className='maslow-row';
  actRow.innerHTML=`<label>Aktivität: ${system.activity} Min</label><input type="number" value="${system.activity}" oninput="updateActivity(this.value)">`;
  maslowBlock.appendChild(actRow);
  container.appendChild(maslowBlock);

  // Budget Block
  const budgetBlock=document.createElement('div');
  budgetBlock.className='block';
  budgetBlock.innerHTML=`<h2>Budget</h2><div class="budget-row"><span>Verfügbar:</span><span class="${(system.budget-system.spent)>15?'good':(system.budget-system.spent)<5?'warning':''}">${(system.budget-system.spent).toFixed(2)}€</span></div><div class="budget-row"><span>Ausgegeben:</span><span>${system.spent.toFixed(2)}€</span></div>`;
  container.appendChild(budgetBlock);

  // Booster / Intervention Block (Timer Beispiel)
  const boosterBlock=document.createElement('div');
  boosterBlock.className='block';
  boosterBlock.innerHTML='<h2>Booster</h2><button onclick="startTimer(30,this)">30s Atemübung starten</button><div class="timer-display hidden" id="timerDisplay">30s</div>';
  container.appendChild(boosterBlock);
}

function executeImpulse(name,effect){
  if(effect.water) system.water=Math.min(8,system.water+effect.water);
  if(effect.activity) system.activity+=effect.activity;
  if(effect.energy) system.energy=Math.min(100,system.energy+effect.energy);
  if(effect.state) system.currentState=effect.state;
  system.history.push({type:'impulse',name,date:Date.now()});
  renderFlow();
}

function updateWater(v){system.water=parseInt(v);renderFlow();}
function updateSleep(v){system.sleep=parseFloat(v);renderFlow();}
function updateActivity(v){system.activity=parseInt(v)||0;renderFlow();}

function startTimer(sec,btn){
  const display=document.getElementById('timerDisplay');
  display.classList.remove('hidden');
  let remaining=sec;
  display.textContent=`${remaining}s`;
  btn.disabled=true;
  const interval=setInterval(()=>{
    remaining--; display.textContent=`${remaining}s`;
    if(remaining<=0){clearInterval(interval);display.classList.add('hidden');btn.disabled=false;}
  },1000);
}

// Init
renderFlow();
</script>
</body>
</html>
